# Local development database: Postgres 18, the major production runs on Railway.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: soonlane
      POSTGRES_PASSWORD: soonlane
      POSTGRES_DB: soonlane
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soonlane -d soonlane]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
