name: Owner Review Commands

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Apply owner review command
    if: |
      github.repository == 'Mnigos/soonlane' &&
      (
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.pull_request &&
          github.event.issue.user.id == 56691628 &&
          github.event.issue.state == 'open' &&
          !github.event.issue.draft &&
          github.event.comment.user.id == 56691628 &&
          github.event.sender.id == 56691628 &&
          (contains(github.event.comment.body, '/approve') || contains(github.event.comment.body, '/request-changes'))
        ) ||
        (
          github.event_name != 'issue_comment' &&
          github.event.pull_request.user.id == 56691628 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.state == 'open' &&
          !github.event.pull_request.draft &&
          (
            (github.event_name == 'pull_request_target' && github.event.action == 'synchronize') ||
            (
              github.event_name == 'pull_request_review' &&
              github.event.review.state == 'commented' &&
              github.event.review.user.id == 56691628 &&
              github.event.sender.id == 56691628 &&
              (contains(github.event.review.body, '/approve') || contains(github.event.review.body, '/request-changes'))
            )
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: owner-review-commands-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/owner-review/owner-review.handler.ts
            .github/scripts/owner-review/owner-review.policy.ts
            .github/scripts/owner-review/owner-review.sources.ts
            .github/scripts/owner-review/owner-review.ts
            .github/scripts/owner-review/owner-review.types.ts
            .github/scripts/owner-review/stale-approvals.handler.ts
            package.json
          sparse-checkout-cone-mode: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Sync owner review
        run: bun --no-env-file .github/scripts/owner-review/owner-review.ts
        env:
          GH_TOKEN: ${{ github.token }}
