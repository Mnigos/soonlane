name: Release

on:
  schedule:
    # Daily nightly check; minute 23 avoids the busy top of the hour.
    - cron: '23 4 * * *'
  # A merged release PR changes version.json; stable publishes the release it pins.
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel. Stable publishes the release version.json pins, unless it is already published.
        type: choice
        options: [nightly, stable]
        default: nightly

# Nightly and stable share one group, so they never overlap; a running release is never canceled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: Release nightly
    if: |
      github.repository == 'Mnigos/soonlane' &&
      (github.event_name == 'schedule' || (inputs.channel == 'nightly' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compute nightly
        id: release
        run: bun --no-env-file scripts/release.ts nightly >> "$GITHUB_OUTPUT"
      - name: Tag and publish the prerelease
        if: steps.release.outputs.has_changes == 'true'
        run: |
          git tag "$TAG" "$SOURCE"
          bun git-cliff --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.' --latest --strip all --output "$RUNNER_TEMP/release-notes.md"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --prerelease --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE: ${{ steps.release.outputs.source }}
      - name: Report no changes
        if: steps.release.outputs.has_changes != 'true'
        run: echo "No commits on main since $PREVIOUS_TAG; no nightly today."
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}

  stable:
    name: Release stable
    if: |
      github.repository == 'Mnigos/soonlane' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Read the release version.json pins
        id: release
        run: bun --no-env-file scripts/release.ts publish --notes "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tag the nightly's commit
        if: steps.release.outputs.released != 'true' && steps.release.outputs.tag_exists != 'true'
        # GitHub refuses this push when main changed a workflow file after the nightly; docs/release.md has the fix.
        run: |
          echo "Promoting $NIGHTLY_TAG ($SOURCE) as $TAG"
          git tag "$TAG" "$SOURCE"
          git push origin "$TAG"
        env:
          NIGHTLY_TAG: ${{ steps.release.outputs.nightly_tag }}
          SOURCE: ${{ steps.release.outputs.source }}
          TAG: ${{ steps.release.outputs.tag }}
      # With desktop releases on, the desktop job marks it latest once the app is attached: until then
      # installed apps and the build's patch step keep reading the previous release.
      - name: Publish the release
        if: steps.release.outputs.released != 'true'
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest="$LATEST"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          LATEST: ${{ vars.DESKTOP_RELEASES != 'true' }}
      - name: Report already released
        if: steps.release.outputs.released == 'true'
        run: echo "$TAG is already released; nothing to publish."
        env:
          TAG: ${{ steps.release.outputs.tag }}

  images:
    name: Publish the self-hosted images
    needs: stable
    if: needs.stable.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ needs.stable.outputs.tag }}

  desktop:
    name: Release the signed macOS app
    needs: stable
    # Off until the Apple signing secrets exist; set the repository variable DESKTOP_RELEASES to true (docs/release.md).
    if: needs.stable.result == 'success' && vars.DESKTOP_RELEASES == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.stable.outputs.tag }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      # A rerun never replaces the files installed apps update from, and never makes an older release latest.
      - name: Read the release's desktop state
        id: state
        run: |
          ATTACHED="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[] | select(.name == "stable-macos-arm64-update-v2.json" and .state == "uploaded" and .size > 0)] | length > 0')"
          # Only a 404 means there is no latest release; any other error stops the job rather than move latest back.
          if ! LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> "$RUNNER_TEMP/latest.err")"; then
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then cat "$RUNNER_TEMP/latest.err"; exit 1; fi
            LATEST=""
          fi
          PROMOTE="$(LATEST="$LATEST" bun --no-env-file -e 'const { TAG, LATEST } = process.env; console.log(!LATEST || Bun.semver.order(TAG.slice(1), LATEST.slice(1)) > 0)')"
          echo "$TAG: app attached $ATTACHED, latest release ${LATEST:-none}, mark latest $PROMOTE"
          echo "attached=$ATTACHED" >> "$GITHUB_OUTPUT"
          echo "promote=$PROMOTE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stable.outputs.tag }}
      - name: Check the signing secrets
        if: steps.state.outputs.attached != 'true'
        # electrobun.config.ts signs only when ELECTROBUN_DEVELOPER_ID is set, so a missing secret would publish an unsigned app.
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_DEVELOPER_ID APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is not set"; exit 1; fi
          done
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Pin the release version
        if: steps.state.outputs.attached != 'true'
        # The tag is the promoted nightly's commit, from before the release PR bumped version.json; the app and its page read that file.
        run: |
          jq --arg version "${TAG#v}" '.version = $version' version.json > "$RUNNER_TEMP/version.json"
          mv "$RUNNER_TEMP/version.json" version.json
        env:
          TAG: ${{ needs.stable.outputs.tag }}
      - name: Import the Developer ID certificate
        if: steps.state.outputs.attached != 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086 # one argument per keychain
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          rm "$RUNNER_TEMP/certificate.p12"
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build, sign and notarize
        id: package
        if: steps.state.outputs.attached != 'true'
        shell: bash
        run: bun run package 2>&1 | tee "$RUNNER_TEMP/package.log"
        working-directory: apps/desktop
        env:
          APP_URL: https://app.soonlane.com
          API_URL: https://api.soonlane.com
          LANDING_URL: https://soonlane.com
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_APP_PASSWORD }}
      # Electrobun prints only the submission id and its status; Apple's log names the file and the reason.
      - name: Print Apple's notarization log
        if: failure() && steps.package.outcome == 'failure'
        shell: bash
        run: |
          IDS="$(grep -oE '"id":"[0-9a-f-]{36}","status":"(Rejected|Invalid)"' "$RUNNER_TEMP/package.log" | cut -d '"' -f 4 | sort -u || true)"
          if [ -z "$IDS" ]; then echo "No rejected notarization submission in the build log."; exit 0; fi
          for ID in $IDS; do
            echo "::group::Notarization log $ID"
            xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "::endgroup::"
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Check the app icon
        if: steps.state.outputs.attached != 'true'
        # Electrobun only logs a missing icon source and ships the bundle with macOS's blank placeholder.
        run: |
          ICON=build/stable-macos-arm64/Soonlane.app/Contents/Resources/AppIcon.icns
          if [ ! -s "$ICON" ]; then echo "::error::The app bundle has no icon: $ICON"; exit 1; fi
        working-directory: apps/desktop
      # The app's updater reads these from the latest release (electrobun.config.ts `release.baseUrl`).
      # The v2 manifest goes last, on its own: once it is uploaded, every other file is too.
      - name: Attach the app and its update files to the release
        if: steps.state.outputs.attached != 'true'
        run: |
          find apps/desktop/artifacts -maxdepth 1 -type f ! -name stable-macos-arm64-update-v2.json -print0 | xargs -0 gh release upload "$TAG" --clobber
          gh release upload "$TAG" apps/desktop/artifacts/stable-macos-arm64-update-v2.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stable.outputs.tag }}
      - name: Mark the release as latest
        if: steps.state.outputs.promote == 'true'
        run: gh release edit "$TAG" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stable.outputs.tag }}
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
