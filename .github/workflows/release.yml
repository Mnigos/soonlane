name: Release

on:
  schedule:
    # Daily nightly check; minute 23 avoids the busy top of the hour.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel. Stable promotes the commit of the latest nightly.
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: Stable only. Version override (X.Y.Z); defaults to the version the latest nightly previewed.
        type: string
        required: false

# Nightly and stable share one group, so they never overlap; a running release is never canceled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: Release nightly
    if: |
      github.repository == 'Mnigos/soonlist' &&
      (github.event_name == 'schedule' || (inputs.channel == 'nightly' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compute nightly
        id: release
        run: bun --no-env-file scripts/release.ts nightly >> "$GITHUB_OUTPUT"
      - name: Tag and publish the prerelease
        if: steps.release.outputs.has_changes == 'true'
        run: |
          git tag "$TAG" "$SOURCE"
          bun git-cliff --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.' --latest --strip all --output "$RUNNER_TEMP/release-notes.md"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --prerelease --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE: ${{ steps.release.outputs.source }}
      - name: Report no changes
        if: steps.release.outputs.has_changes != 'true'
        run: echo "No commits on main since $PREVIOUS_TAG; no nightly today."
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}

  stable:
    name: Release stable
    if: |
      github.repository == 'Mnigos/soonlist' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compute version from the latest nightly
        id: release
        run: bun --no-env-file scripts/release.ts stable --version "$VERSION_INPUT" >> "$GITHUB_OUTPUT"
        env:
          VERSION_INPUT: ${{ inputs.version }}
      - name: Write changelog and version file
        run: |
          echo "Promoting $NIGHTLY_TAG ($SOURCE) as $TAG"
          git tag "$TAG" "$SOURCE"
          bun git-cliff --output CHANGELOG.md
          bun git-cliff --latest --strip all --output "$RUNNER_TEMP/release-notes.md"
          bun --no-env-file scripts/release.ts write-version "$VERSION"
        env:
          NIGHTLY_TAG: ${{ steps.release.outputs.nightly_tag }}
          SOURCE: ${{ steps.release.outputs.source }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
      - name: Commit, tag and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md version.json
          git commit -m "chore(release): $TAG" -m '[skip ci]'
          git push origin HEAD:main
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}
          HUSKY: '0'
          TAG: ${{ steps.release.outputs.tag }}
