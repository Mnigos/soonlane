name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable]
        default: stable
      version:
        description: Version override (X.Y.Z). Defaults to the version computed from conventional commits since the last stable tag.
        type: string
        required: false

# One release at a time; a running release is never canceled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stable:
    name: Release stable
    if: github.repository == 'Mnigos/soonlist' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compute version
        id: release
        run: bun --no-env-file scripts/release.ts stable --version "$VERSION_INPUT" >> "$GITHUB_OUTPUT"
        env:
          VERSION_INPUT: ${{ inputs.version }}
      - name: Write changelog and version file
        run: |
          git tag "$TAG" "$SOURCE"
          bunx git-cliff --output CHANGELOG.md
          bunx git-cliff --latest --strip all --output "$RUNNER_TEMP/release-notes.md"
          bun --no-env-file scripts/release.ts write-version "$VERSION"
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE: ${{ steps.release.outputs.source }}
          VERSION: ${{ steps.release.outputs.version }}
      - name: Commit, tag and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md version.json
          git commit -m "chore(release): $TAG" -m '[skip ci]'
          git push origin HEAD:main
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}
          HUSKY: '0'
          TAG: ${{ steps.release.outputs.tag }}
