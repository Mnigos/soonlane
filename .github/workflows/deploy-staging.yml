name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy to staging
        required: true
        default: main

permissions:
  contents: read

# One staging deploy at a time; a running deploy is never canceled.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
  RAILWAY: bunx @railway/cli@5.71.0
  REF: ${{ inputs.ref }}

jobs:
  api:
    name: Deploy the API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # `railway up` uploads no git metadata, so the build inlines the commit from this file (kept in the upload by .railwayignore).
      - name: Record the commit
        run: echo "APP_COMMIT=$(git rev-parse HEAD)" > apps/api/commit.env
      - name: Build, deploy and wait for the health check
        run: |
          upload=$($RAILWAY up --service api --environment staging --detach --json --message "$REF $(git rev-parse --short HEAD)")
          deployment=$(jq -r '.deploymentId' <<< "$upload")
          echo "Build logs: $(jq -r '.logsUrl' <<< "$upload")"
          for attempt in $(seq 60); do
            status=$($RAILWAY deployment list --service api --environment staging --json | jq -r --arg id "$deployment" '.[] | select(.id == $id) | .status')
            echo "Deployment status: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED | CRASHED | REMOVED | SKIPPED) exit 1 ;;
            esac
            sleep 10
          done
          exit 1

  web:
    name: Publish the web app
    # The API goes first, so the web app never calls an API older than itself.
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # Vercel builds the `staging` branch and serves it on staging.soonlane.com.
      - name: Point the staging branch at the ref
        run: git push --force origin HEAD:refs/heads/staging
