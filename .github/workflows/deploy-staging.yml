name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy to staging
        required: true
        default: main

permissions:
  contents: read

# One staging deploy at a time; a running deploy is never canceled.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
  RAILWAY: bunx @railway/cli@5.71.0
  REF: ${{ inputs.ref }}

jobs:
  deploy:
    name: Deploy the API, the web app and the site
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # `railway up` uploads no git metadata, so each build inlines the commit from these files (kept in the upload by .railwayignore).
      - name: Record the commit
        run: |
          echo "APP_COMMIT=$COMMIT" > apps/api/commit.env
          echo "APP_COMMIT=$COMMIT" > apps/web/commit.env
          echo "APP_COMMIT=$COMMIT" > apps/site/commit.env
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
      - name: Build, deploy and wait for the health checks
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          deploy() {
            upload=$($RAILWAY up --service "$1" --environment staging --detach --json --message "$REF ${COMMIT::7}")
            deployment=$(jq -r '.deploymentId' <<< "$upload")
            echo "$1 build logs: $(jq -r '.logsUrl' <<< "$upload")"
            for attempt in $(seq 60); do
              status=$($RAILWAY deployment list --service "$1" --environment staging --json | jq -r --arg id "$deployment" '.[] | select(.id == $id) | .status')
              echo "$1 deployment status: $status"
              case "$status" in
                SUCCESS) return 0 ;;
                FAILED | CRASHED | REMOVED | SKIPPED) return 1 ;;
              esac
              sleep 10
            done
            return 1
          }
          # The API goes first, so the app and the site never call an API older than themselves.
          deploy api
          deploy web
          deploy site
