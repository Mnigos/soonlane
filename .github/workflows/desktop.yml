name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - version.json
      - bun.lock
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS arm64 app (unsigned)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/desktop
      - name: Build the app
        run: bun run package
        working-directory: apps/desktop
        env:
          APP_URL: https://app.soonlane.com
      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: soonlane-macos-arm64-unsigned
          path: |
            apps/desktop/artifacts/*.dmg
            apps/desktop/artifacts/*.app.tar.zst
          if-no-files-found: error
          retention-days: 14
