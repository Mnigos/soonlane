name: Linear Priority Labels

on:
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: linear-priority-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync priority labels from Linear
    if: github.repository == 'Mnigos/soonlane'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request_target runs with secrets, so only the default branch's script runs, never the PR's code.
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/linear-priority/linear-priority.policy.ts
            .github/scripts/linear-priority/linear-priority.ts
            package.json
          sparse-checkout-cone-mode: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Sync priority labels
        run: bun --no-env-file .github/scripts/linear-priority/linear-priority.ts
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
