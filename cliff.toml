# git-cliff configuration. CHANGELOG.md and version.json are written only by the release workflow.

[changelog]
header = """
# Changelog

Written by the release workflow from conventional commits; never edit this file by hand.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Mnigos/soonlane/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}{% if group != "Internal" %}
{% for scope, scoped in commits | group_by(attribute="scope") %}
### {{ group | striptags | trim }} › {{ scope }}

{% for commit in scoped -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Mnigos/soonlane/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
{% endif %}{% endfor %}\
{% endif %}\
"""
footer = ""
trim = true
postprocessors = [
	{ pattern = '\n{3,}', replace = "\n\n" },
	{ pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/Mnigos/soonlane/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Stable releases only; nightly prereleases use --tag-pattern on the command line.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
# Product scopes only (AGENTS.md); the rest is hidden, not skipped, since git-cliff drops a release whose commits are all skipped.
commit_parsers = [
	{ message = "^feat\\((tasks|labels|shell|desktop|identity|site|blog|changelog|consent)\\)!?:", group = "<!-- 0 -->Features" },
	{ message = "^fix\\((tasks|labels|shell|desktop|identity|site|blog|changelog|consent)\\)!?:", group = "<!-- 1 -->Bug fixes" },
	{ message = "^perf\\((tasks|labels|shell|desktop|identity|site|blog|changelog|consent)\\)!?:", group = "<!-- 2 -->Performance" },
	{ message = ".*", group = "Internal" },
]
